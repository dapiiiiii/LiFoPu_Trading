# LiFoPu Trading in Docker: the site plus its own MariaDB database.
#   docker compose up -d --build     build and start (site on http://localhost:8080)
#   docker compose logs -f app       follow the site's log
#   docker compose down              stop (the database is kept in the db-data volume)
#
# The app reads your .env (APP_KEY, mail, Turnstile...). The database settings below
# replace the XAMPP ones from .env inside the container only; your local setup is unchanged.

services:
  app:
    build: .
    image: lifopu-trading
    ports:
      - "${APP_PORT:-8080}:80"
    env_file: .env
    environment:
      APP_URL: "http://localhost:${APP_PORT:-8080}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-lifopu}"
      DB_USERNAME: lifopu
      DB_PASSWORD: "${DOCKER_DB_PASSWORD:-change-me-lifopu}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: "${DB_DATABASE:-lifopu}"
      MARIADB_USER: lifopu
      MARIADB_PASSWORD: "${DOCKER_DB_PASSWORD:-change-me-lifopu}"
      MARIADB_ROOT_PASSWORD: "${DOCKER_DB_ROOT_PASSWORD:-change-me-root}"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  db-data:
