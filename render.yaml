# Render Blueprint: the site (from the Dockerfile) plus a PostgreSQL database.
# Render dashboard > New > Blueprint > pick this repository. Values marked sync: false
# are asked for once when the Blueprint is created.

services:
  - type: web
    name: lifopu-trading
    runtime: docker
    plan: free            # free sleeps when idle and cannot send SMTP mail; "starter" can
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeploy: true      # redeploys on every push to main
    envVars:
      - key: APP_NAME
        value: LiFoPu Trading
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY      # paste the output of: php artisan key:generate --show
        sync: false
      - key: TRUSTED_PROXIES
        value: "*"
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync

      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase: { name: lifopu-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: lifopu-db, property: port }
      - key: DB_DATABASE
        fromDatabase: { name: lifopu-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: lifopu-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: lifopu-db, property: password }

      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: INQUIRY_MAIL_TO
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false

databases:
  - name: lifopu-db
    plan: free            # free databases expire after 30 days; use a paid plan for real use
    region: frankfurt
    databaseName: lifopu
    user: lifopu
