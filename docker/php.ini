; PHP settings for the LiFoPu container (loaded after php.ini-production).
expose_php = Off
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 60

; The code inside the image never changes, so OPcache never needs to re-check files.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
